<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SynthReview — AI Product Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #161616;
    --border: #222222;
    --gold: #c9a84c;
    --gold-dim: #8a6f2e;
    --text: #e8e0d0;
    --text-dim: #6b6358;
    --white: #f5f0e8;
    --green: #4caf7d;
    --red: #c0574a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,168,76,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 90% 90%, rgba(201,168,76,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 800px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* HEADER */
  header {
    padding: 56px 0 44px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }

  .logo-mark {
    display: inline-block;
    width: 2px;
    height: 28px;
    background: var(--gold);
    margin-bottom: 24px;
    animation: pulse-bar 2s ease-in-out infinite;
  }

  @keyframes pulse-bar {
    0%, 100% { opacity: 1; transform: scaleY(1); }
    50% { opacity: 0.4; transform: scaleY(0.6); }
  }

  .brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    font-weight: 300;
    letter-spacing: 0.18em;
    color: var(--white);
    text-transform: uppercase;
    display: block;
    line-height: 1;
  }

  .brand span { color: var(--gold); }
  .tagline {
    margin-top: 12px;
    font-size: 0.6rem;
    letter-spacing: 0.35em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 44px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
  }
  .divider::before { background: linear-gradient(90deg, transparent, var(--border)); }
  .divider::after { background: linear-gradient(90deg, var(--border), transparent); }
  .divider-icon { color: var(--gold-dim); font-size: 0.5rem; }

  /* INPUT */
  .input-label {
    display: block;
    font-size: 0.58rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .input-wrapper { display: flex; margin-bottom: 40px; }

  .url-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-right: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    padding: 16px 18px;
    outline: none;
    transition: border-color 0.3s;
  }
  .url-input::placeholder { color: var(--text-dim); font-size: 0.7rem; }
  .url-input:focus { border-color: var(--gold-dim); }

  .submit-btn {
    background: var(--gold);
    border: 1px solid var(--gold);
    color: #0a0a0a;
    font-family: 'DM Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    padding: 16px 26px;
    cursor: pointer;
    transition: all 0.3s;
    white-space: nowrap;
  }
  .submit-btn:hover { background: var(--white); border-color: var(--white); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* LOADING */
  .loading { display: none; text-align: center; padding: 44px 0; }
  .loading.active { display: block; }
  .loading-bars {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 5px;
    height: 28px;
    margin-bottom: 16px;
  }
  .loading-bars span {
    display: block;
    width: 3px;
    background: var(--gold);
    animation: bar-dance 1.2s ease-in-out infinite;
    border-radius: 2px;
  }
  .loading-bars span:nth-child(1) { animation-delay: 0s; height: 10px; }
  .loading-bars span:nth-child(2) { animation-delay: 0.15s; height: 18px; }
  .loading-bars span:nth-child(3) { animation-delay: 0.3s; height: 26px; }
  .loading-bars span:nth-child(4) { animation-delay: 0.45s; height: 18px; }
  .loading-bars span:nth-child(5) { animation-delay: 0.6s; height: 10px; }
  @keyframes bar-dance {
    0%, 100% { transform: scaleY(0.4); opacity: 0.4; }
    50% { transform: scaleY(1); opacity: 1; }
  }
  .loading-text { font-size: 0.58rem; letter-spacing: 0.3em; color: var(--text-dim); text-transform: uppercase; }

  /* ERROR */
  .error-msg { display: none; background: rgba(192,57,43,0.08); border: 1px solid rgba(192,57,43,0.3); color: #e74c3c; padding: 12px 16px; font-size: 0.7rem; margin-top: 10px; }
  .error-msg.active { display: block; }

  /* RESULT */
  .result { display: none; opacity: 0; transform: translateY(20px); transition: all 0.6s cubic-bezier(0.16,1,0.3,1); }
  .result.active { display: block; opacity: 1; transform: translateY(0); }

  /* PRODUCT HEADER */
  .product-header {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
  }
  .product-image {
    width: 88px;
    height: 88px;
    object-fit: contain;
    background: var(--surface);
    border: 1px solid var(--border);
    flex-shrink: 0;
    padding: 8px;
  }
  .product-image.hidden { display: none; }
  .product-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-weight: 400;
    color: var(--white);
    line-height: 1.4;
    margin-bottom: 10px;
  }
  .rating-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .rating-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 300;
    color: var(--gold);
    line-height: 1;
  }
  .stars { display: flex; gap: 3px; }
  .star {
    width: 10px; height: 10px;
    background: var(--gold);
    clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  }
  .star.empty { background: var(--border); }
  .rating-label { font-size: 0.52rem; letter-spacing: 0.22em; color: var(--text-dim); text-transform: uppercase; }

  /* SECTION LABEL */
  .section-label {
    font-size: 0.52rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* SUMMARY */
  .summary-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    font-weight: 300;
    line-height: 1.85;
    color: var(--text);
    margin-bottom: 28px;
  }

  /* SENTIMENT METER */
  .sentiment-block { margin-bottom: 28px; }
  .sentiment-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .sentiment-pct {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    color: var(--green);
  }
  .sentiment-neg {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    color: var(--red);
  }
  .meter-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green), var(--gold));
    border-radius: 2px;
    transition: width 1s cubic-bezier(0.16,1,0.3,1);
    width: 0%;
  }
  .meter-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
  }
  .meter-labels span { font-size: 0.5rem; letter-spacing: 0.2em; color: var(--text-dim); text-transform: uppercase; }

  /* PROS CONS */
  .pros-cons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 28px;
  }
  @media (max-width: 560px) { .pros-cons { grid-template-columns: 1fr; } }

  .pros-box, .cons-box {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 18px;
  }
  .pros-box { border-top: 2px solid var(--green); }
  .cons-box { border-top: 2px solid var(--red); }

  .box-title {
    font-size: 0.52rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .pros-box .box-title { color: var(--green); }
  .cons-box .box-title { color: var(--red); }

  .pros-list, .cons-list { list-style: none; }
  .pros-list li, .cons-list li {
    font-size: 0.72rem;
    line-height: 1.6;
    color: var(--text);
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .pros-list li:last-child, .cons-list li:last-child { border-bottom: none; }
  .pros-list li::before { content: '+'; color: var(--green); flex-shrink: 0; font-weight: bold; }
  .cons-list li::before { content: '−'; color: var(--red); flex-shrink: 0; font-weight: bold; }

  /* VERDICT */
  .verdict-box {
    background: var(--surface2);
    border: 1px solid var(--gold-dim);
    padding: 16px 20px;
    margin-bottom: 28px;
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .verdict-icon { color: var(--gold); font-size: 1rem; flex-shrink: 0; }
  .verdict-label { font-size: 0.5rem; letter-spacing: 0.25em; color: var(--gold-dim); text-transform: uppercase; display: block; margin-bottom: 4px; }
  .verdict-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    font-style: italic;
    color: var(--white);
    line-height: 1.4;
  }

  /* HIGHLIGHTS */
  .highlights-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .highlight-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--gold-dim);
    padding: 14px 16px;
  }
  .highlight-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .highlight-title { font-size: 0.72rem; color: var(--white); font-weight: 400; }
  .highlight-stars { font-size: 0.6rem; color: var(--gold); letter-spacing: 2px; }
  .highlight-comment { font-size: 0.68rem; color: var(--text-dim); line-height: 1.6; font-style: italic; }

  /* FOOTER */
  footer { text-align: center; padding: 44px 0 32px; border-top: 1px solid var(--border); margin-top: 56px; }
  .footer-text { font-size: 0.52rem; letter-spacing: 0.28em; color: var(--text-dim); text-transform: uppercase; }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-in { animation: fade-up 0.7s cubic-bezier(0.16,1,0.3,1) both; }
  .delay-1 { animation-delay: 0.1s; }
  .delay-2 { animation-delay: 0.2s; }
</style>
</head>
<body>
<div class="container">

  <header class="animate-in">
    <div class="logo-mark"></div>
    <span class="brand">Synth<span>Review</span></span>
    <p class="tagline">AI-Powered Product Intelligence</p>
  </header>

  <div class="divider animate-in delay-1"><span class="divider-icon">◆</span></div>

  <div class="animate-in delay-2">
    <label class="input-label" for="urlInput">Amazon Product URL</label>
    <div class="input-wrapper">
      <input type="text" id="urlInput" class="url-input"
        placeholder="https://www.amazon.in/dp/B08N5WRWNW"
        autocomplete="off" spellcheck="false"/>
      <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">Analyse</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="loading" id="loading">
    <div class="loading-bars">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <p class="loading-text" id="loadingText">Fetching reviews</p>
  </div>

  <div class="result" id="result">

    <!-- PRODUCT HEADER -->
    <div class="product-header">
      <img id="productImage" class="product-image hidden" src="" alt="Product"/>
      <div>
        <h2 class="product-title" id="productTitle"></h2>
        <div class="rating-row">
          <div class="rating-number" id="ratingNumber"></div>
          <div class="stars" id="starsDisplay"></div>
          <div class="rating-label">Overall Rating</div>
        </div>
      </div>
    </div>

    <!-- SUMMARY -->
    <div class="section-label">AI Summary</div>
    <p class="summary-text" id="summaryText"></p>

    <!-- SENTIMENT METER -->
    <div class="sentiment-block">
      <div class="section-label">Sentiment Analysis</div>
      <div class="sentiment-header">
        <span class="sentiment-pct" id="positivePct"></span>
        <span class="sentiment-neg" id="negativePct"></span>
      </div>
      <div class="meter-track">
        <div class="meter-fill" id="meterFill"></div>
      </div>
      <div class="meter-labels">
        <span>Positive</span>
        <span>Negative</span>
      </div>
    </div>

    <!-- PROS AND CONS -->
    <div class="section-label">Pros & Cons</div>
    <div class="pros-cons">
      <div class="pros-box">
        <div class="box-title">What people love</div>
        <ul class="pros-list" id="prosList"></ul>
      </div>
      <div class="cons-box">
        <div class="box-title">What people dislike</div>
        <ul class="cons-list" id="consList"></ul>
      </div>
    </div>

    <!-- VERDICT -->
    <div class="verdict-box">
      <div class="verdict-icon">◆</div>
      <div>
        <span class="verdict-label">Verdict</span>
        <div class="verdict-text" id="verdictText"></div>
      </div>
    </div>

    <!-- REVIEW HIGHLIGHTS -->
    <div class="section-label">Review Highlights</div>
    <div class="highlights-list" id="highlightsList"></div>

  </div>

  <footer>
    <p class="footer-text">SynthReview &nbsp;·&nbsp; AI Product Intelligence &nbsp;·&nbsp; Amazon Reviews API</p>
  </footer>

</div>

<script>
  const loadingMessages = [
    "Fetching reviews",
    "Analysing sentiment",
    "Extracting pros & cons",
    "Crafting verdict"
  ];

  function showLoading() {
    let i = 0;
    const el = document.getElementById("loadingText");
    return setInterval(() => {
      el.textContent = loadingMessages[i % loadingMessages.length];
      i++;
    }, 1800);
  }

  function renderStars(rating) {
    const num = parseFloat(rating);
    const container = document.getElementById("starsDisplay");
    container.innerHTML = "";
    for (let i = 1; i <= 5; i++) {
      const star = document.createElement("div");
      star.className = "star" + (i <= Math.round(num) ? "" : " empty");
      container.appendChild(star);
    }
  }

  function renderList(items, containerId, emptyMsg) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    if (!items || items.length === 0) {
      const li = document.createElement("li");
      li.textContent = emptyMsg;
      container.appendChild(li);
      return;
    }
    items.forEach(item => {
      const li = document.createElement("li");
      li.textContent = item;
      container.appendChild(li);
    });
  }

  function renderHighlights(highlights) {
    const container = document.getElementById("highlightsList");
    container.innerHTML = "";
    if (!highlights || highlights.length === 0) return;
    highlights.forEach(h => {
      const stars = "★".repeat(parseInt(h.stars) || 0) + "☆".repeat(5 - (parseInt(h.stars) || 0));
      const card = document.createElement("div");
      card.className = "highlight-card";
      card.innerHTML = `
        <div class="highlight-header">
          <span class="highlight-title">${h.title}</span>
          <span class="highlight-stars">${stars}</span>
        </div>
        <div class="highlight-comment">"${h.comment}"</div>
      `;
      container.appendChild(card);
    });
  }

  async function handleSubmit() {
    const url = document.getElementById("urlInput").value.trim();
    const btn = document.getElementById("submitBtn");
    const errorEl = document.getElementById("errorMsg");
    const loadingEl = document.getElementById("loading");
    const resultEl = document.getElementById("result");

    errorEl.classList.remove("active");
    resultEl.classList.remove("active");
    resultEl.style.display = "none";

    if (!url) {
      errorEl.textContent = "Please enter an Amazon product URL.";
      errorEl.classList.add("active");
      return;
    }

    btn.disabled = true;
    loadingEl.classList.add("active");
    const interval = showLoading();

    try {
      const res = await fetch("/summarize", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });

      const data = await res.json();
      clearInterval(interval);
      loadingEl.classList.remove("active");

      if (!res.ok || data.error) {
        errorEl.textContent = data.error || "Something went wrong. Please try again.";
        errorEl.classList.add("active");
        return;
      }

      // Populate all fields
      document.getElementById("productTitle").textContent = data.title;
      document.getElementById("ratingNumber").textContent = data.rating;
      document.getElementById("summaryText").textContent = data.summary;
      document.getElementById("verdictText").textContent = data.verdict;

      renderStars(data.rating);
      renderList(data.pros, "prosList", "No pros found");
      renderList(data.cons, "consList", "No cons found");
      renderHighlights(data.highlights);

      // Sentiment meter
      const pct = data.sentiment || 50;
      document.getElementById("positivePct").textContent = pct + "% Positive";
      document.getElementById("negativePct").textContent = (100 - pct) + "% Negative";
      setTimeout(() => {
        document.getElementById("meterFill").style.width = pct + "%";
      }, 100);

      // Product image
      const img = document.getElementById("productImage");
      if (data.image) {
        img.src = data.image;
        img.classList.remove("hidden");
      } else {
        img.classList.add("hidden");
      }

      resultEl.style.display = "block";
      setTimeout(() => resultEl.classList.add("active"), 10);

    } catch (err) {
      clearInterval(interval);
      loadingEl.classList.remove("active");
      errorEl.textContent = "Network error. Please try again.";
      errorEl.classList.add("active");
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById("urlInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleSubmit();
  });
</script>
</body>
</html>
